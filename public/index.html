<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="/images/favicon/favicon.ico"/>
<link rel="icon" type="image/png" sizes="32x32" href="/images/favicon/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/images/favicon/favicon-16x16.png">
<link rel="apple-touch-icon" sizes="180x180" href="/images/favicon/apple-touch-icon.png">
<link rel="manifest" href="/images/favicon/site.webmanifest">
<title>AudioSpace</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
<link rel="stylesheet" type="text/css" id="applicationStylesheet" href="/css/landing.css"/>
<script id="applicationScript" src="/js/xd-runtime.js"></script>
</head>
<body>
<div id="main">
	<div id="website">
		<img id="bg" src="/images/bg.png" srcset="/images/bg.png 1x, /images/bg@2x.png 2x" alt="">

		<div id="mountains">
			<img id="mtn_8" src="/images/mtn_8.png" srcset="/images/mtn_8.png 1x, /images/mtn_8@2x.png 2x" alt="">
			<img id="mtn_7" src="/images/mtn_7.png" srcset="/images/mtn_7.png 1x, /images/mtn_7@2x.png 2x" alt="">
			<img id="mtn_6" src="/images/mtn_6.png" srcset="/images/mtn_6.png 1x, /images/mtn_6@2x.png 2x" alt="">
			<img id="mtn_5" src="/images/mtn_5.png" srcset="/images/mtn_5.png 1x, /images/mtn_5@2x.png 2x" alt="">
			<img id="mtn_4" src="/images/mtn_4.png" srcset="/images/mtn_4.png 1x, /images/mtn_4@2x.png 2x" alt="">
			<img id="mtn_3" src="/images/mtn_3.png" srcset="/images/mtn_3.png 1x, /images/mtn_3@2x.png 2x" alt="">
			<img id="mtn_2" src="/images/mtn_2.png" srcset="/images/mtn_2.png 1x, /images/mtn_2@2x.png 2x" alt="">
			<img id="mtn_1" src="/images/mtn_1.png" srcset="/images/mtn_1.png 1x, /images/mtn_1@2x.png 2x" alt="">
		</div>
		<div id="Meet_new_people_everyday_Liste">
			<span>Meet new people everyday!<br/>Listen live podcasts from all around the world.</span>
		</div>
		<div class="sign_in_box">
			<div class="sign_in_container animate__animated animate__fadeInUp" id="sign_in_container">
				<div class="sign_in_form">
					<br><br><h1>Sign in</h1><br>
					<span>Welcome back!</span>
					<p class="form_error" id="sign_in_error"></p>
					<form action="/login" method="post">
						<div class="input_box">
							<label><img src="/images/icons/mail.png" class="mail" alt="Email"></label>
							<input type="email" placeholder="Email" required name="email" autocomplete="email">
						</div>
						<div class="input_box">
							<label><img src="/images/icons/password.png" class="password" alt="Password"></label>
							<input type="password" placeholder="Password" required name="pass" autocomplete="current-password">
						</div>
						<div class="input_box">
							<input type="submit" value="Login">
						</div>
					</form>
				</div>
			</div>
		</div>
		<div class="sign_up_box">
			<div class="sign_up_container animate__animated animate__fadeInUp" id="sign_up_container">
				<div class="sign_up_form">
					<br><br><h1>Sign up</h1><br>
					<span>And enter a whole new world!</span>
					<p class="form_error" id="sign_up_error"></p>
					<form action="/signup" method="post">
						<div class="input_box">
							<label><img src="/images/icons/user.png" class="text" alt="Name"></label>
							<input type="text" placeholder="Name" name="name" required autocomplete="name">
						</div>
						<div class="input_box">
							<label><img src="/images/icons/mail.png" class="mail" alt="Email"></label>
							<input type="email" placeholder="Email" name="email" required autocomplete="email">
						</div>
						<div class="input_box">
							<label><img src="/images/icons/password.png" class="password" alt="Password"></label>
							<input type="password" placeholder="Password" id="password" name="pass" required minlength="6" autocomplete="new-password">
						</div>
						<div class="input_box">
							<input type="password" placeholder="Confirm Password" id="confirm_password" required autocomplete="new-password">
						</div>
						<div class="input_box">
							<input type="submit" value="Sign up">
						</div>
					</form>
				</div>
			</div>
		</div>
		<button id="Sign_In" class="buttonGrow">
			<span>Sign In</span>
		</button>
		<button id="Sign_Up" class="buttonGrow">
			<span>Sign Up</span>
		</button>
		<a href="#main"><img id="Logo" src="/images/Logo.png" srcset="/images/Logo.png 1x, /images/Logo@2x.png 2x" alt="AudioSpace"></a>

		<a id="Enter_as_guest" class="buttonGrow" href="/guest">
			<span>Enter as guest</span>
		</a>
		<button id="scroll" class="buttonHang">
			<div id="Scroll_z">
				<span>Scroll</span>
			</div>
			<svg class="Polygon_1" viewBox="0 0 25 23">
				<path id="Polygon_1" d="M 12.49999904632568 0 L 25 23 L 0 23 Z">
				</path>
			</svg>
		</button>
	</div>
</div>
<script src="/js/landing.js"></script>
</body>
</html>
