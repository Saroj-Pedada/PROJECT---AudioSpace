<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="/images/favicon/favicon.ico"/>
    <title>Room - AudioSpace</title>
    <link rel="stylesheet" href="/css/dashboard.css">
    <link rel="stylesheet" href="/css/room.css">
</head>
<body>
    <div id="Navbar">
        <a href="/dashboard" id="audiospace">Audio<span class="space">Space</span></a>
        <a href="/dashboard" class="glass-button">Leave quietly</a>
    </div>
    <main class="room">
        <h1 id="room-name"></h1>
        <p id="status" class="status"></p>
        <div id="participants" class="participants"></div>
        <div class="controls">
            <button class="glass-button" id="toggle-mic" disabled>Mute</button>
            <button class="glass-button" id="enable-audio" hidden>Click to hear the room</button>
        </div>
    </main>
    <script src="/socket.io/socket.io.js"></script>
    <script src="/js/room.js"></script>
</body>
</html>
