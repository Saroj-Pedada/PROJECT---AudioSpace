services:
  - type: web
    name: audiospace
    runtime: node
    plan: free
    # devDependencies hold the build tooling (Vite, Tailwind, TypeScript).
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/rooms
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: SESSION_SECRET
        generateValue: true
