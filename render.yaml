services:
  - type: web
    name: audiospace
    runtime: node
    plan: free
    # npm ci also builds the client (postinstall runs "npm run build").
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/rooms
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: SESSION_SECRET
        generateValue: true
      # Password for the built-in admin (sarojp.dev@gmail.com); Render asks for it on setup.
      - key: ADMIN_PASSWORD
        sync: false
